# OPTIONAL: use this configuration only if you choose a Render plan that supports persistent disks.
# Copy this file over render.yaml before deploying, or configure the disk from the Render Dashboard.
services:
  - type: web
    name: carpincho-orbital-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: carpincho-orbital-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: sqlite:////var/data/astrohealth.db
      - key: VR_API_KEY
        generateValue: true
